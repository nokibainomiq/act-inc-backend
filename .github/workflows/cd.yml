name: CD Workflow (Main Branch -> AWS EC2)

# Deploys on every push to main, and on demand from the Actions tab.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PM2_APP: ${{ vars.PM2_APP }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          envs: DEPLOY_PATH,PM2_APP
          script: |
            source ~/.bashrc 2>/dev/null || true
            source ~/.profile 2>/dev/null || true
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.yarn/bin:$HOME/.npm-global/bin

            # Stop at the first failure, so a broken build never gets restarted into.
            set -eo pipefail

            APP_DIR="${DEPLOY_PATH:-$HOME/actinc/backend}"
            APP_NAME="${PM2_APP:-actinc-backend}"
            echo "Deploying $APP_NAME in $APP_DIR"
            cd "$APP_DIR"

            git fetch origin main
            git reset --hard origin/main
            echo "Now at $(git log --oneline -1)"

            if command -v yarn >/dev/null; then
              yarn install
              yarn build
            else
              npm install
              npm run build
            fi

            # Restart only this app; never fall back to restarting everything.
            pm2 restart "$APP_NAME" --update-env
            pm2 save
            echo "Deployed $APP_NAME"
